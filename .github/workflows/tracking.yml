name: KITTI tracking evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install trackeval==1.1.0
      - run: python -m unittest discover -s experiments/kitti_tracking -p test_tracking.py -v
      - run: python -m zipfile -e experiments/kitti_tracking/traces.zip output/kitti-audit
      - run: python experiments/kitti_tracking/audit.py output/kitti-audit
