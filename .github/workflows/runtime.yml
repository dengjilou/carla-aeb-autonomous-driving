name: Native and ROS control checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            build: native-linux
          - os: windows-latest
            build: native-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/deps | Out-Null
          curl.exe --fail --location 'https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz' -o output/deps/eigen.tar.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash output/deps/eigen.tar.gz -Algorithm SHA256).Hash -ne '8586084F71F9BDE545EE7FA6D00288B264A2B7AC3607B974E54D13E7162C1C72') { throw 'Eigen checksum mismatch' }
          tar -xzf output/deps/eigen.tar.gz -C output/deps
          cmake -S output/deps/eigen-3.4.0 -B output/deps/eigen-build -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/output/deps/eigen-install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install output/deps/eigen-build
      - run: python -m pip install numpy
      - run: cmake -S native -B output/${{ matrix.build }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/output/deps/eigen-install"
      - run: cmake --build output/${{ matrix.build }} --config Release
      - run: ctest --test-dir output/${{ matrix.build }} -C Release --output-on-failure
      - run: python -m unittest discover -s tests -p test_control_native.py -v
      - run: python -m unittest discover -s tests -p test_lqr_native.py -v
      - run: python -m unittest discover -s tests -p test_ros_transport.py -v
  ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -y libeigen3-dev python3-numpy python3-colcon-common-extensions ros-jazzy-rosidl-default-generators ros-jazzy-nav-msgs ros-jazzy-rosgraph-msgs ros-jazzy-launch-ros ros-jazzy-tf2-ros
      - run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base output/ros-log build --base-paths ros2 --build-base output/ros-build --install-base output/ros-install
          source output/ros-install/setup.bash
          export ROS_DOMAIN_ID=53
          ros2 launch control_runtime control.launch.py > output/ros-ci.log 2>&1 &
          launch_pid=$!
          trap 'kill -TERM "$launch_pid"; wait "$launch_pid" || true' EXIT
          for attempt in {1..30}; do
            if ros2 topic info /control/state 2>/dev/null | grep -q 'Subscription count: 1'; then break; fi
            sleep 1
          done
          ROS_LIVE_TEST=1 python3 -m unittest discover -s tests -p test_ros_live.py -v
